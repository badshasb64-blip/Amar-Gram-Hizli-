<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>আমার গ্রাম হিজলী</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, "Noto Sans Bengali", sans-serif;
    }

    body {
      margin: 0;
      background: #f2f5f7;
      color: #222;
    }

    header {
      background: #087f5b;
      color: white;
      padding: 18px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    header p {
      margin: 5px 0 0;
      font-size: 14px;
    }

    .container {
      width: 95%;
      max-width: 900px;
      margin: 20px auto;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
      color: #087f5b;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    button {
      border: none;
      padding: 11px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      margin: 5px 3px;
    }

    .primary {
      background: #087f5b;
      color: white;
    }

    .danger {
      background: #d90429;
      color: white;
    }

    .secondary {
      background: #495057;
      color: white;
    }

    .edit {
      background: #f08c00;
      color: white;
    }

    .hidden {
      display: none;
    }

    .person {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin: 10px 0;
      background: #fafafa;
    }

    .person h3 {
      margin: 0 0 8px;
      color: #087f5b;
    }

    .person p {
      margin: 5px 0;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .message {
      padding: 10px;
      border-radius: 8px;
      margin: 10px 0;
      display: none;
    }

    .success {
      background: #d3f9d8;
      color: #2b8a3e;
    }

    .error {
      background: #ffe3e3;
      color: #c92a2a;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .stat {
      background: #e6fcf5;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 25px;
      color: #087f5b;
    }

    @media(max-width:600px) {
      .stats {
        grid-template-columns: 1fr 1fr;
      }

      button {
        width: auto;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🏡 আমার গ্রাম হিজলী</h1>
  <p>গ্রামের তথ্য ব্যবস্থাপনা</p>
</header>

<div class="container">

  <!-- LOGIN -->
  <div id="loginSection" class="card">
    <h2>🔐 Admin Login</h2>

    <input
      type="email"
      id="loginEmail"
      placeholder="Admin Email">

    <input
      type="password"
      id="loginPassword"
      placeholder="Password">

    <button class="primary" onclick="login()">
      Login
    </button>

    <div id="loginMessage" class="message"></div>
  </div>


  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden">

    <div class="card">
      <div class="topbar">
        <div>
          <h2>📊 Admin Dashboard</h2>
          <div id="adminEmail"></div>
        </div>

        <button class="danger" onclick="logout()">
          Logout
        </button>
      </div>
    </div>


    <!-- STATISTICS -->
    <div class="stats">

      <div class="stat">
        <strong id="totalPeople">0</strong>
        মোট ব্যক্তি
      </div>

      <div class="stat">
        <strong id="maleCount">0</strong>
        পুরুষ
      </div>

    </div>


    <!-- ADD PERSON -->
    <div class="card">

      <h2 id="formTitle">➕ নতুন ব্যক্তির তথ্য</h2>

      <input
        type="hidden"
        id="editId">

      <input
        type="text"
        id="name"
        placeholder="নাম">

      <input
        type="text"
        id="father"
        placeholder="পিতার নাম">

      <input
        type="text"
        id="mother"
        placeholder="মাতার নাম">

      <select id="gender">
        <option value="">লিঙ্গ নির্বাচন করুন</option>
        <option value="পুরুষ">পুরুষ</option>
        <option value="নারী">নারী</option>
      </select>

      <input
        type="date"
        id="dob">

      <input
        type="text"
        id="phone"
        placeholder="মোবাইল নম্বর">

      <input
        type="text"
        id="village"
        value="হিজলী"
        placeholder="গ্রাম">

      <input
        type="text"
        id="address"
        placeholder="ঠিকানা">

      <textarea
        id="note"
        placeholder="অতিরিক্ত তথ্য"></textarea>

      <button
        class="primary"
        onclick="savePerson()">
        💾 তথ্য সংরক্ষণ
      </button>

      <button
        class="secondary hidden"
        id="cancelEdit"
        onclick="cancelEdit()">
        বাতিল
      </button>

      <div id="saveMessage" class="message"></div>

    </div>


    <!-- SEARCH -->
    <div class="card">

      <h2>🔎 তথ্য খুঁজুন</h2>

      <input
        type="text"
        id="search"
        placeholder="নাম / মোবাইল / পিতার নাম লিখুন..."
        oninput="showPeople()">

    </div>


    <!-- PEOPLE -->
    <div class="card">

      <h2>👥 গ্রামের মানুষের তালিকা</h2>

      <div id="peopleList">
        তথ্য লোড হচ্ছে...
      </div>

    </div>

  </div>

</div>


<!-- FIREBASE -->

<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

  import {
    getDatabase,
    ref,
    push,
    set,
    update,
    remove,
    onValue
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


  // =========================
  // FIREBASE CONFIG
  // =========================

  const firebaseConfig = {

    apiKey:
      "AIzaSyAyR6lBD-mCUSxLtbAQoObJsVcHHd44lyk",

    authDomain:
      "amar-gram-hijli.firebaseapp.com",

    databaseURL:
      "https://amar-gram-hijli-default-rtdb.firebaseio.com",

    projectId:
      "amar-gram-hijli",

    storageBucket:
      "amar-gram-hijli.firebasestorage.app",

    messagingSenderId:
      "426703886497",

    appId:
      "1:426703886497:web:2fe094342c5200d4f878e0",

    measurementId:
      "G-S7STZ1RZJ9"
  };


  // =========================
  // INITIALIZE
  // =========================

  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getDatabase(app);


  let people = {};


  // =========================
  // LOGIN
  // =========================

  window.login = async function() {

    const email =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;


    if (!email || !password) {

      showMessage(
        "loginMessage",
        "Email এবং Password দিন।",
        "error"
      );

      return;
    }


    try {

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    } catch(error) {

      showMessage(
        "loginMessage",
        "Login হয়নি: " + error.message,
        "error"
      );

    }

  };


  // =========================
  // AUTH STATE
  // =========================

  onAuthStateChanged(auth, user => {

    if(user) {

      document
        .getElementById("loginSection")
        .classList.add("hidden");

      document
        .getElementById("dashboard")
        .classList.remove("hidden");

      document
        .getElementById("adminEmail")
        .textContent =
        "Logged in: " + user.email;

      loadPeople();

    } else {

      document
        .getElementById("loginSection")
        .classList.remove("hidden");

      document
        .getElementById("dashboard")
        .classList.add("hidden");

    }

  });


  // =========================
  // LOGOUT
  // =========================

  window.logout = async function() {

    await signOut(auth);

  };


  // =========================
  // SAVE PERSON
  // =========================

  window.savePerson = async function() {

    const name =
      document.getElementById("name").value.trim();

    const father =
      document.getElementById("father").value.trim();

    const mother =
      document.getElementById("mother").value.trim();

    const gender =
      document.getElementById("gender").value;

    const dob =
      document.getElementById("dob").value;

    const phone =
      document.getElementById("phone").value.trim();

    const village =
      document.getElementById("village").value.trim();

    const address =
      document.getElementById("address").value.trim();

    const note =
      document.getElementById("note").value.trim();

    const editId =
      document.getElementById("editId").value;


    if(!name) {

      showMessage(
        "saveMessage",
        "নাম অবশ্যই দিতে হবে।",
        "error"
      );

      return;
    }


    const data = {

      name,
      father,
      mother,
      gender,
      dob,
      phone,
      village,
      address,
      note,

      updatedAt: Date.now()

    };


    try {

      if(editId) {

        await update(
          ref(db, "people/" + editId),
          data
        );

        showMessage(
          "saveMessage",
          "তথ্য সফলভাবে আপডেট হয়েছে।",
          "success"
        );

      } else {

        data.createdAt = Date.now();

        const newRef =
          push(ref(db, "people"));

        await set(
          newRef,
          data
        );

        showMessage(
          "saveMessage",
          "তথ্য সফলভাবে সংরক্ষণ হয়েছে।",
          "success"
        );

      }


      clearForm();

    } catch(error) {

      showMessage(
        "saveMessage",
        "তথ্য সংরক্ষণ হয়নি: " +
        error.message,
        "error"
      );

    }

  };


  // =========================
  // LOAD PEOPLE
  // =========================

  function loadPeople() {

    const peopleRef =
      ref(db, "people");


    onValue(
      peopleRef,
      snapshot => {

        people =
          snapshot.val() || {};

        showPeople();

      },
      error => {

        document
          .getElementById("peopleList")
          .innerHTML =
          "<p>তথ্য লোড হয়নি: " +
          error.message +
          "</p>";

      }
    );

  }


  // =========================
  // SHOW PEOPLE
  // =========================

  window.showPeople = function() {

    const list =
      document.getElementById("peopleList");

    const search =
      document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    list.innerHTML = "";


    const entries =
      Object.entries(people);


    let filtered =
      entries.filter(([id, person]) => {

        const text =
          (
            person.name || "" +
            " " +
            (person.father || "") +
            " " +
            (person.phone || "") +
            " " +
            (person.village || "")
          ).toLowerCase();

        return text.includes(search);

      });


    document
      .getElementById("totalPeople")
      .textContent =
      entries.length;


    document
      .getElementById("maleCount")
      .textContent =
      entries.filter(
        ([id,p]) => p.gender === "পুরুষ"
      ).length;


    if(filtered.length === 0) {

      list.innerHTML =
        "<p>কোনো তথ্য পাওয়া যায়নি।</p>";

      return;

    }


    filtered.forEach(([id, person]) => {

      const div =
        document.createElement("div");

      div.className = "person";


      div.innerHTML = `

        <h3>👤 ${escapeHtml(person.name || "")}</h3>

        <p>
          <b>পিতা:</b>
          ${escapeHtml(person.father || "-")}
        </p>

        <p>
          <b>মাতা:</b>
          ${escapeHtml(person.mother || "-")}
        </p>

        <p>
          <b>লিঙ্গ:</b>
          ${escapeHtml(person.gender || "-")}
        </p>

        <p>
          <b>জন্মতারিখ:</b>
          ${escapeHtml(person.dob || "-")}
        </p>

        <p>
          <b>মোবাইল:</b>
          ${escapeHtml(person.phone || "-")}
        </p>

        <p>
          <b>গ্রাম:</b>
          ${escapeHtml(person.village || "-")}
        </p>

        <p>
          <b>ঠিকানা:</b>
          ${escapeHtml(person.address || "-")}
        </p>

        <p>
          <b>নোট:</b>
          ${escapeHtml(person.note || "-")}
        </p>

        <button
          class="edit"
          onclick="editPerson('${id}')">
          ✏️ Edit
        </button>

        <button
          class="danger"
          onclick="deletePerson('${id}')">
          🗑️ Delete
        </button>

      `;


      list.appendChild(div);

    });

  };


  // =========================
  // EDIT
  // =========================

  window.editPerson = function(id) {

    const person = people[id];

    if(!person) return;


    document.getElementById("editId").value = id;

    document.getElementById("name").value =
      person.name || "";

    document.getElementById("father").value =
      person.father || "";

    document.getElementById("mother").value =
      person.mother || "";

    document.getElementById("gender").value =
      person.gender || "";

    document.getElementById("dob").value =
      person.dob || "";

    document.getElementById("phone").value =
      person.phone || "";

    document.getElementById("village").value =
      person.village || "";

    document.getElementById("address").value =
      person.address || "";

    document.getElementById("note").value =
      person.note || "";


    document.getElementById("formTitle")
      .textContent =
      "✏️ তথ্য পরিবর্তন করুন";


    document.getElementById("cancelEdit")
      .classList.remove("hidden");


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  };


  // =========================
  // DELETE
  // =========================

  window.deletePerson = async function(id) {

    const person = people[id];

    if(!person) return;


    const ok =
      confirm(
        "আপনি কি " +
        person.name +
        " এর তথ্য মুছে ফেলতে চান?"
      );


    if(!ok) return;


    try {

      await remove(
        ref(db, "people/" + id)
      );

    } catch(error) {

      alert(
        "Delete হয়নি: " +
        error.message
      );

    }

  };


  // =========================
  // CANCEL EDIT
  // =========================

  window.cancelEdit = function() {

    clearForm();

  };


  // =========================
  // CLEAR FORM
  // =========================

  function clearForm() {

    document.getElementById("editId").value = "";

    document.getElementById("name").value = "";

    document.getElementById("father").value = "";

    document.getElementById("mother").value = "";

    document.getElementById("gender").value = "";

    document.getElementById("dob").value = "";

    document.getElementById("phone").value = "";

    document.getElementById("village").value = "হিজলী";

    document.getElementById("address").value = "";

    document.getElementById("note").value = "";


    document.getElementById("formTitle")
      .textContent =
      "➕ নতুন ব্যক্তির তথ্য";


    document.getElementById("cancelEdit")
      .classList.add("hidden");

  }


  // =========================
  // MESSAGE
  // =========================

  function showMessage(
    id,
    text,
    type
  ) {

    const box =
      document.getElementById(id);

    box.textContent = text;

    box.className =
      "message " + type;

    box.style.display =
      "block";


    setTimeout(() => {

      box.style.display =
        "none";

    }, 4000);

  }


  // =========================
  // SECURITY
  // =========================

  function escapeHtml(value) {

    return String(value)

      .replaceAll("&", "&amp;")

      .replaceAll("<", "&lt;")

      .replaceAll(">", "&gt;")

      .replaceAll('"', "&quot;")

      .replaceAll("'", "&#039;");

  }

</script>

</body>
</html>
